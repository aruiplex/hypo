name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: |
          pip install ruff pyright pytest
          pip install -e .[dev]

      - name: Run Ruff Format Check
        run: ruff format --check src/ test/

      - name: Run Ruff Check
        run: ruff check src/ test/

      - name: Run Pyright
        run: pyright src/ test/

      - name: Run Pytest
        run: pytest test/
